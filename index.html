<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Resso Wave</title>
  <meta name="theme-color" content="#ff0055">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #0b0c10;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Search Header */
    .top-search {
      padding: 12px 16px;
      background: #14161f;
      display: flex;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }
    .search-input {
      flex: 1;
      background: #1f2230;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .search-btn {
      background: #ff0055;
      border: none;
      color: #fff;
      padding: 0 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }
    /* Tracks List */
    .song-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      padding-bottom: 120px;
    }
    .song-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .song-card:active {
      background: rgba(255, 0, 85, 0.2);
    }
    .song-card img {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      object-fit: cover;
      background: #222;
    }
    .song-info {
      flex: 1;
      overflow: hidden;
    }
    .song-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-artist {
      font-size: 0.8rem;
      color: #888;
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-text {
      text-align: center;
      color: #aaa;
      margin-top: 50px;
      font-size: 0.95rem;
    }
    /* Bottom Player Bar */
    .bottom-player {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #151722;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 -8px 25px rgba(0,0,0,0.6);
    }
    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      cursor: pointer;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #ff0055;
      border-radius: 2px;
    }
    .player-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .p-thumb {
      width: 46px;
      height: 46px;
      border-radius: 8px;
      object-fit: cover;
      background: #333;
    }
    .p-meta {
      flex: 1;
      overflow: hidden;
    }
    .p-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .p-artist {
      font-size: 0.75rem;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .p-play-btn {
      background: #ff0055;
      border: none;
      color: #fff;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Top Search Bar -->
  <div class="top-search">
    <input type="text" id="search-input" class="search-input" placeholder="Search Hindi/English songs, singer..." value="Arijit Singh">
    <button class="search-btn" id="search-btn">Go</button>
  </div>

  <!-- Songs Feed -->
  <div class="song-list" id="song-list">
    <div class="status-text" id="status-text">Fetching songs...</div>
  </div>

  <!-- Bottom Floating Player -->
  <div class="bottom-player">
    <div class="progress-bar-bg" id="p-bar">
      <div class="progress-bar-fill" id="p-fill"></div>
    </div>
    <div class="player-row">
      <img id="p-img" class="p-thumb" src="https://via.placeholder.com/150" alt="cover">
      <div class="p-meta">
        <div id="p-name" class="p-title">Select any track</div>
        <div id="p-singer" class="p-artist">Real music stream</div>
      </div>
      <button class="p-play-btn" id="p-btn">▶</button>
    </div>
  </div>

  <!-- Real Audio Engine -->
  <audio id="audio-player" playsinline preload="auto"></audio>

  <script>
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const songList = document.getElementById('song-list');
    const statusText = document.getElementById('status-text');
    const audio = document.getElementById('audio-player');
    const pBtn = document.getElementById('p-btn');
    const pName = document.getElementById('p-name');
    const pSinger = document.getElementById('p-singer');
    const pImg = document.getElementById('p-img');
    const pFill = document.getElementById('p-fill');
    const pBar = document.getElementById('p-bar');

    // iTunes Music API - Completely Free, CORS Enabled & Never Blocked
    async function searchMusic(query) {
      if (!query.trim()) return;
      songList.innerHTML = '<div class="status-text">Searching database...</div>';

      try {
        const url = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&media=music&entity=song&limit=30`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.results && data.results.length > 0) {
          songList.innerHTML = '';
          data.results.forEach((item) => {
            const title = item.trackName;
            const artist = item.artistName;
            const artwork = item.artworkUrl100 ? item.artworkUrl100.replace('100x100bb', '300x300bb') : '';
            const previewUrl = item.previewUrl;

            if (!previewUrl) return;

            const card = document.createElement('div');
            card.className = 'song-card';
            card.innerHTML = `
              <img src="${artwork}" alt="cover" loading="lazy">
              <div class="song-info">
                <div class="song-title">${title}</div>
                <div class="song-artist">${artist}</div>
              </div>
            `;

            card.onclick = () => {
              playTrack(title, artist, artwork, previewUrl);
            };

            songList.appendChild(card);
          });
        } else {
          songList.innerHTML = '<div class="status-text">No tracks found. Search singer or song name.</div>';
        }
      } catch (err) {
        console.error(err);
        songList.innerHTML = '<div class="status-text">Error loading. Check your internet connection.</div>';
      }
    }

    function playTrack(title, artist, img, streamUrl) {
      pName.innerText = title;
      pSinger.innerText = artist;
      pImg.src = img;

      audio.src = streamUrl;
      audio.load();
      audio.play().then(() => {
        pBtn.innerText = '⏸';
      }).catch(e => {
        console.log("Tap again to play", e);
      });
    }

    pBtn.onclick = () => {
      if (!audio.src) return;
      if (audio.paused) {
        audio.play();
        pBtn.innerText = '⏸';
      } else {
        audio.pause();
        pBtn.innerText = '▶';
      }
    };

    audio.ontimeupdate = () => {
      if (audio.duration) {
        pFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
      }
    };

    pBar.onclick = (e) => {
      if (audio.duration) {
        audio.currentTime = (e.offsetX / pBar.clientWidth) * audio.duration;
      }
    };

    searchBtn.onclick = () => searchMusic(searchInput.value);
    searchInput.onkeypress = (e) => {
      if (e.key === 'Enter') searchMusic(searchInput.value);
    };

    // First load on start
    searchMusic('Arijit Singh');
  </script>
</body>
</html>
